services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: langgraph_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DATABASE:-langgraph_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-langgraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langgraph_network

  neo4j:
    image: neo4j:5.26-community
    container_name: reasoning_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-reasoning}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"     # browser
      - "7687:7687"     # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - langgraph_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langgraph_backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-ollama}
      - MODEL_NAMES=${MODEL_NAMES:-["llama3.1"]}
      - MODEL_BASE_URL=http://host.docker.internal:11434
      - EMBEDDINGS_MODEL_NAME=${EMBEDDINGS_MODEL_NAME:-nomic-embed-text}
      - EMBEDDINGS_BASE_URL=http://host.docker.internal:11434
      - TOKEN_BEARER_URL=${TOKEN_BEARER_URL:-/api/v1/auth/login}
      - JWT_SECRET=${JWT_SECRET:-f7410f8d0107749f066a06b360288d1d92bc8f9c23e3326d069793743d4992f2}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRY_MINS=${ACCESS_TOKEN_EXPIRY_MINS:-1440}
      - REFRESH_TOKEN_EXPIRY_DAYS=${REFRESH_TOKEN_EXPIRY_DAYS:-1}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-langgraph_db}
      - PGVECTOR_COLLECTION_NAME=${PGVECTOR_COLLECTION_NAME:-my_collection}
      - MEMORY_DECAY_RATE=${MEMORY_DECAY_RATE:-0.05}
      - MEMORY_MAX_AGE_DAYS=${MEMORY_MAX_AGE_DAYS:-30}
      - MEMORY_CONSOLIDATION_INTERVAL=${MEMORY_CONSOLIDATION_INTERVAL:-10}
      - MEMORY_IMPORTANCE_THRESHOLD=${MEMORY_IMPORTANCE_THRESHOLD:-0.3}
      # --- reasoning layer -------------------------------------------------
      - REASONER_MODEL=${REASONER_MODEL:-qwen2.5:3b}
      - CRITIC_MODEL=${CRITIC_MODEL:-qwen3:1.7b}
      - RERANKER_MODEL=${RERANKER_MODEL:-}
      - RETRIEVAL_MAX_HOPS=${RETRIEVAL_MAX_HOPS:-3}
      - INDEX_VERSION=${INDEX_VERSION:-v1}
      - DEFAULT_TIER=${DEFAULT_TIER:-standard}
      - ADAPTIVE_ROUTING=${ADAPTIVE_ROUTING:-true}
      - LABS_ENABLED=${LABS_ENABLED:-true}
      - TRACE_RETENTION_DAYS=${TRACE_RETENTION_DAYS:-30}
      - GRAPH_ENABLED=${GRAPH_ENABLED:-true}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-reasoning}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - REPLICA_USER=${REPLICA_USER:-reasoning_reader}
      - REPLICA_PASSWORD=${REPLICA_PASSWORD:-reasoning_reader}
      - SQL_STATEMENT_TIMEOUT_MS=${SQL_STATEMENT_TIMEOUT_MS:-8000}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - langgraph_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure:3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: langgraph_frontend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - langgraph_network
    restart: on-failure:3

volumes:
  postgres_data:
  neo4j_data:

networks:
  langgraph_network:
    driver: bridge